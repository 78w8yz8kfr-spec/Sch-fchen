<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e30613"><title>Lagerstruktur · Schäfchen</title>
  <link rel="icon" href="./assets/mark.svg" type="image/svg+xml">
  <!--
    Diese Seite war frueher die vollstaendige Lagerstruktur-Oberflaeche - ohne
    Seitenleiste, Kopfzeile oder Suche der Arbeitsapp. Genau das hat der
    Nutzer zu Recht bemaengelt ("sieht aus wie eine Handy-App"). Die
    Lagerstruktur lebt jetzt als Bereich in index.html (data-dashboard-pane
    "inventory") und erbt dort Seitenleiste, Kopfzeile und Rollensteuerung.
    Diese Datei bleibt nur als schlanke Weiterleitung fuer bereits gesetzte
    Lesezeichen bestehen - nach dem Vorbild von frontend/refresh.html braucht
    sie deshalb weder inventory.css noch die volle Lagerlogik, nur
    styles.css/design-system.css fuer den kurzen Hinweis unten.
  -->
  <link rel="stylesheet" href="./styles.css?v=0.44.54">
  <link rel="stylesheet" href="./design-system.css?v=0.44.54">
  <script type="module" src="./inventory.js?v=0.44.54"></script>
</head>
<body>
<main class="view login-view">
  <section class="login-card">
    <div class="brand brand--large">
      <img src="./assets/mark.svg" alt="" width="56" height="56">
      <div>
        <p class="eyebrow">Betrieb</p>
      </div>
    </div>
    <div class="page-heading">
      <div>
        <h1>Lagerstruktur</h1>
        <p>Dieser Bereich ist jetzt Teil der Arbeitsapp. Du wirst automatisch dorthin weitergeleitet.</p>
      </div>
      <div class="page-heading__actions">
        <button id="inventory-open" type="button" class="button button--primary">Jetzt öffnen</button>
      </div>
    </div>
    <div class="card">
      <p><a class="text-button" href="./">← Zur Arbeitsapp</a></p>
    </div>
  </section>
</main>
</body>
</html>
