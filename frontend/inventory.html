<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e30613"><title>Lagerstruktur · Schäfchen</title>
  <link rel="icon" href="./assets/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./design-system.css?v=0.44.48">
  <link rel="stylesheet" href="./inventory.css?v=0.44.48">
  <script type="module" src="./inventory.js?v=0.44.48"></script>
</head>
<body><main class="inv-shell">
<header class="inv-header"><a class="inv-back" href="./">← Zur Arbeitsapp</a><img src="./assets/mark.svg" alt="Schäfchen" width="40" height="40"></header>
<div class="inv-intro"><p class="eyebrow">Betrieb</p><h1>Lagerstruktur</h1>
<p class="inv-hint">Lager → Bereich → Regal → Fach. Hier organisierst du Lagerplätze; Artikel und Bestandsbuchungen folgen getrennt.</p></div>
<div class="card inv-notice"><p id="message" role="status" aria-live="polite" class="inv-status">Lagerstruktur wird geladen …</p></div>
<div id="workspace" class="inv-stack" hidden>
  <div class="card inv-toolbar">
    <label class="inv-search-label">Suchen <input id="search" type="search" placeholder="Name oder Code"></label>
    <label class="inv-check"><input id="archived" type="checkbox"> Archivierte anzeigen</label>
    <div class="inv-toolbar__actions"><button id="add" type="button" class="button button--primary" hidden>+ Lager anlegen</button><button id="reload" type="button" class="button button--secondary">Neu laden</button></div>
  </div>
  <div id="locations" aria-label="Lagerplätze" class="card inv-locations"></div>
  <section id="history" class="card inv-history" hidden><h2>Änderungshistorie</h2><p class="inv-hint">Die letzten 100 Änderungen dieses Lagerplatzes.</p><ol id="events" class="inv-history__list"></ol></section>
</div>
<dialog id="editor" class="inv-dialog"><form id="form" class="inv-form">
  <h2 id="editor-title">Lagerplatz anlegen</h2>
  <p id="parent-label" class="inv-hint"></p>
  <label>Code <input id="code" required maxlength="30" pattern="[A-Za-z0-9][A-Za-z0-9_-]{0,29}" autocomplete="off" placeholder="z. B. L1, R01, F01"></label>
  <label>Name <input id="name" required maxlength="120" autocomplete="off"></label>
  <p id="form-message" role="alert" class="inv-form-message"></p>
  <div class="inv-form__actions"><button id="save" type="submit" class="button button--primary">Speichern</button><button id="cancel" type="button" class="button button--secondary">Abbrechen</button></div>
</form></dialog>
</main></body></html>
