<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#e30613"><title>Abwesenheiten freigeben · Schäfchen</title>
<link rel="icon" href="./assets/mark.svg" type="image/svg+xml">
<!--
  Diese Seite war frueher die vollstaendige Oberflaeche der Abwesenheits-
  freigabe - ohne Seitenleiste, Kopfzeile oder Suche der Arbeitsapp. Genau das
  hat der Nutzer zu Recht bemaengelt ("sieht aus wie eine Handy-App"). Die
  Abwesenheitsfreigabe lebt jetzt als Bereich in index.html
  (data-dashboard-pane "absences") und erbt dort Seitenleiste, Kopfzeile und
  Rollensteuerung. Diese Datei bleibt nur als schlanke Weiterleitung fuer
  bereits gesetzte Lesezeichen bestehen (auch mit dem Anker "#direct-entry")
  - nach dem Vorbild von frontend/refresh.html braucht sie deshalb weder
  absence-approvals.css noch die volle Freigabelogik, nur
  styles.css/design-system.css fuer den kurzen Hinweis unten.
-->
<link rel="stylesheet" href="./styles.css?v=0.44.54">
<link rel="stylesheet" href="./design-system.css?v=0.44.54">
<script type="module" src="./absence-approvals.js?v=0.44.54"></script>
</head>
<body>
<main class="view login-view">
  <section class="login-card">
    <div class="brand brand--large">
      <img src="./assets/mark.svg" alt="" width="56" height="56">
      <div>
        <p class="eyebrow">Urlaub und Abwesenheit</p>
      </div>
    </div>
    <div class="page-heading">
      <div>
        <h1>Abwesenheiten freigeben</h1>
        <p>Dieser Bereich ist jetzt Teil der Arbeitsapp. Du wirst automatisch dorthin weitergeleitet.</p>
      </div>
      <div class="page-heading__actions">
        <button id="aa-absence-open" type="button" class="button button--primary">Jetzt öffnen</button>
      </div>
    </div>
    <div class="card">
      <p><a class="text-button" href="./#week">← Zur Arbeitsapp</a></p>
    </div>
  </section>
</main>
</body>
</html>
