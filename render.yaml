services:
  - type: web
    name: schaefchen-online
    runtime: docker
    region: frankfurt
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile.production
    dockerContext: .
    dockerCommand: sh deploy/render-start.sh
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    numInstances: 1
    envVars:
      - key: NODE_ENV
        value: production
      # Dieser kostenlose Dienst bleibt eine Vorführung und darf keine echten
      # Firmendaten aufnehmen. Eine reale Umgebung nutzt eine eigene,
      # geschützte Render-Umgebung und APP_ENVIRONMENT=production.
      - key: APP_ENVIRONMENT
        value: demo
      - key: API_PORT
        value: 10000
      - key: STATIC_DIRECTORY
        value: /app/frontend
      - key: DATABASE_URL
        fromDatabase:
          name: schaefchen-postgres
          property: connectionString
      - key: API_DB_USER
        value: schaefchen_api_login
      - key: API_DB_PASSWORD
        generateValue: true
      - key: API_DB_SSL_MODE
        value: require
      - key: API_TRUSTED_PROXY_HOPS
        value: "1"
      - key: SECURITY_RATE_LIMIT_SECRET
        generateValue: true
      - key: UPLOAD_SCAN_REQUIRED
        value: "false"
      - key: INITIAL_COMPANY_NUMBER
        value: F-000001
      - key: INITIAL_SETUP_TOKEN
        sync: false
      - key: PLATFORM_SETUP_TOKEN
        sync: false
      - key: SESSION_TTL_SECONDS
        value: "28800"
      - key: APP_TIME_ZONE
        value: Europe/Berlin

databases:
  - name: schaefchen-postgres
    databaseName: schaefchen
    user: schaefchen_owner
    region: frankfurt
    plan: free
    postgresMajorVersion: "17"
    ipAllowList: []
